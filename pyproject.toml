[project]
name = "orble-inspect"
version = "0.1.0"
description = "Inspect AI sandboxes on Orble boxes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["inspect_ai>=0.3.100", "asyncssh>=2.14", "httpx>=0.27", "pyyaml", "pydantic>=2"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.urls]
Homepage = "https://orble.tech"
Repository = "https://github.com/lxe/orble-inspect"

[project.entry-points.inspect_ai]
orble_inspect = "orble_inspect._registry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orble_inspect"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/test_self_check.py" = ["F403"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["asyncssh.*"]
follow_untyped_imports = true
